<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="productlist.css">
    <script src="list.js" defer></script>
    <title>tiny moneky</title>
</head>

<body>
    <header>
        <nav>
            <div><a href="index.html"> <img class="logo" src="imgs/monkey.png" alt="logo"></a></div>
            <div class="navlink">
                <p><a href="">Categories</a></p>
                <p><a href="">Brands</a></p>
                <p><a href="">Seasons</a></p>
            </div>
        </nav>
    </header>
    <main>
        <h2>Nike</h2>
        <p>Products from Nike</p>
        <div class="product_list_container">
            <div class="filter_gender_buttons_container">
                <div data-filter="All" class="list_button active">selected</div>
                <div data-filter="Unisex" class="list_button active">Unisex</div>
                <div data-filter="Men" class="list_button active">Men</div>
                <div data-filter="Women" class="list_button active">Women</div>
            </div>
            <div class="filter_season_buttons_container">
                <div data-filter="Winter" class="list_button active">winter</div>
                <div data-filter="Spring" class="list_button active">Spring</div>
                <div data-filter="Summer" class="list_button active">Summer</div>
                <div data-filter="Fall" class="list_button active">Fall</div>
            </div>
            <div class="product_list_container"> </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
